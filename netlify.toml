[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"

# Security headers for every page
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://plausible.io https://connect.facebook.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://res.cloudinary.com https://www.google-analytics.com https://*.google-analytics.com https://www.googletagmanager.com https://www.facebook.com; media-src 'self' https://res.cloudinary.com; font-src 'self'; connect-src 'self' https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com https://plausible.io https://www.facebook.com https://connect.facebook.net; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests"

# Long-lived caching for hashed build assets and optimised images
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/art/_opt/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# Clean URLs: /privacy → /privacy.html
[[redirects]]
  from = "/privacy/"
  to = "/privacy"
  status = 301
[[redirects]]
  from = "/terms/"
  to = "/terms"
  status = 301

# Social preview images and the Apple touch icon are exported without a file extension.
[[headers]]
  for = "/opengraph-image"
  [headers.values]
    Content-Type = "image/png"
[[headers]]
  for = "/twitter-image"
  [headers.values]
    Content-Type = "image/png"
[[headers]]
  for = "/apple-icon"
  [headers.values]
    Content-Type = "image/png"
